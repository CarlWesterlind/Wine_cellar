# Static analysis: `flutter analyze` (and your editor) checks the code against
# these rules. https://dart.dev/tools/analysis
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/l10n/app_localizations*.dart # generated by `flutter gen-l10n`
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Consistent style
    - always_declare_return_types
    - directives_ordering
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - sort_child_properties_last
    - unnecessary_parenthesis
    - use_super_parameters
    # Catch mistakes
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - only_throw_errors
    - prefer_void_to_null
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously
